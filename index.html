  <body style="color-scheme: only dark !important; background-color: #07090e !important; forced-color-adjust: none !important; -webkit-forced-color-adjust: none !important;">
    <div id="root"></div>
    <script>
      // Force purge stale Service Workers and all Cache Storage to guarantee instant asset updates
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) {
            caches.delete(keys[i]);
          }
        });
      }

      // Universal mobile touch-callout and long-press context menu blocker
      // Stops iOS Safari and Android Chrome from showing "wizzardev.com" link/image previews or callout menus
      window.addEventListener('contextmenu', function(e) {
        var isTouch = 'ontouchstart' in window || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0) || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
        if (isTouch) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }, { capture: true, passive: false });
    </script>
