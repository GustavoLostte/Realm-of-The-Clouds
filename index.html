<!doctype html>
<html lang="es" style="color-scheme: dark !important; background-color: #07090e !important; forced-color-adjust: none !important; -webkit-forced-color-adjust: none !important;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/assets/logo/logo.webp" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Realm of the Clouds" />
    <meta name="application-name" content="Realm of the Clouds" />
    <meta name="msapplication-TileColor" content="#090c10" />
    <meta name="msapplication-TileImage" content="/icons/icon-512.png" />
    <meta name="theme-color" content="#090c10" />
    <meta name="color-scheme" content="dark" />
    <meta name="color-scheme" content="only dark" />
    <meta name="supported-color-schemes" content="dark" />
    <style>
      :root, html, body, #root, *, *::before, *::after, svg, path, circle, rect {
        color-scheme: only dark !important;
        forced-color-adjust: none !important;
        -webkit-forced-color-adjust: none !important;
      }
      html, body {
        background-color: #07090e !important;
        color: #f8fafc !important;
      }
    </style>
    <title>Realm of the Clouds</title>
    <meta name="description" content="Realm of the Clouds - Motor de juego y estrategia interactivo con soporte Web3" />
    <!-- Google Fonts: Cinzel & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Noto+Serif+KR:wght@500;700;900&family=Noto+Serif+SC:wght@500;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="color-scheme: dark !important; background-color: #07090e !important; forced-color-adjust: none !important; -webkit-forced-color-adjust: none !important;">
    <div id="root"></div>
    <script>
      // Automatically purge development Service Worker and Cache Storage on localhost
      // to guarantee live ES module updates and avoid stale import caches
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) {
              if (keys[i].indexOf('toc-foe') !== -1 || keys[i].indexOf('pwa-web3') !== -1) {
                caches.delete(keys[i]);
              }
            }
          });
        }
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
